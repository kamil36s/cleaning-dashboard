<!DOCTYPE html>
<html lang="pl">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dziennik głosowy</title>
  <link rel="stylesheet" href="./styles.css" />
</head>

<body class="page-voice-journal">
  <div class="voice-journal-page-shell">
    <header class="voice-journal-page-header">
      <div>
        <div class="voice-journal-page-kicker">Lokalny Whisper</div>
        <h1>Dziennik głosowy</h1>
        <p>Transkrypcje, timestampy, edycja i historia nagrań.</p>
      </div>
      <a class="card-cta" href="./index.html">Dashboard</a>
    </header>

    <main class="card voice-journal voice-journal-page-card" role="main">
      <header class="header">
        <div class="title" id="voice-journal-title">
          <svg class="ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm-7-3h2a5 5 0 0 0 10 0h2a7 7 0 0 1-6 6.92V21h-2v-3.08A7 7 0 0 1 5 11Z" />
          </svg>
          <div>
            <div>Nowa transkrypcja i zapisane wpisy</div>
            <div class="meta">Wszystkie dane pozostają lokalnie</div>
          </div>
        </div>
        <div class="voice-journal-backend-pill" id="voice-journal-backend-pill" role="status">Sprawdzam backend…</div>
      </header>
      <div id="voice-journal-root" data-voice-journal-mode="full"></div>
    </main>
  </div>

  <script type="module" src="./js/widget-voice-journal.js"></script>
</body>

</html>
